<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  .pf-navlinks { display: none; }
  .pf-menubtn { display: inline-flex; }
  @media (min-width: 880px) {
    .pf-navlinks { display: flex; }
    .pf-menubtn { display: none; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #161512; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: #57B98D; color: #161512; }
  .blog-body { --bg: #161512; --fg: #F6F4EF; --panel: #201F1B; --line: rgba(246,244,239,0.16); --line-strong: rgba(246,244,239,0.30); --dim: #A79C8C; --accent: #57B98D; --on-accent: #0E1A15; }
</style>
</helmet>

<div class="blog-body" style="font-family:'Inter',sans-serif; min-height:100vh; background:var(--bg); color:var(--fg);">

  <header style="position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(16px) saturate(1.5); border-bottom:1px solid var(--line);">
    <div style="max-width:1200px; margin:0 auto; padding:0 clamp(16px,4vw,40px); height:64px; display:flex; align-items:center; justify-content:space-between; gap:20px;">
      <a href="index.dc.html" style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; letter-spacing:0.14em; color:var(--fg);">BLU<span style="color:var(--accent);">WX</span></a>
      <nav class="pf-navlinks" style="align-items:center; gap:30px; font-size:14px; font-weight:500;">
        <a href="index.dc.html">Network</a>
        <a href="Shop.dc.html">Shop</a>
        <a href="Directory.dc.html">Clubs</a>
        <a href="HowItWorks.dc.html">How it works</a>
        <a href="Blog.dc.html" style="color:var(--accent);">Blogs</a>
      </nav>
      <a href="Cart.dc.html" style="font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.06em; color:var(--fg); display:inline-flex; align-items:center; gap:6px;">CART<span style="display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px; background:var(--accent); color:var(--on-accent); border-radius:9px; font-size:10px;">{{ cartCount }}</span></a>
    </div>
  </header>

  <main style="max-width:1200px; margin:0 auto; padding:0 clamp(16px,4vw,40px);">
    <section style="padding:clamp(40px,6vw,72px) 0 clamp(24px,3vw,32px);">
      <div style="font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:var(--accent);">The padel community</div>
      <h1 style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:clamp(38px,6.5vw,72px); line-height:0.98; letter-spacing:-0.03em; margin:16px 0 0;">Blog</h1>
      <p style="font-size:clamp(16px,1.5vw,18px); line-height:1.6; color:var(--dim); max-width:60ch; margin:22px 0 0;">News, stories and updates from clubs, players and events across the BLUWX network.</p>
    </section>

    <section style="padding:clamp(12px,2vw,24px) 0 clamp(56px,8vw,100px);">
      <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px;">
        <sc-for list="{{ posts }}" as="post" hint-placeholder-count="2">
          <a href="{{ post.href }}" style="display:flex; flex-direction:column; border:1px solid var(--line); background:var(--panel); border-radius:20px; overflow:hidden; transition:transform .22s, border-color .22s, box-shadow .22s;" style-hover="border-color:var(--accent); transform:translateY(-6px); box-shadow:0 20px 44px rgba(0,0,0,0.30);">
            <div style="position:relative; aspect-ratio:4/5; overflow:hidden; background:#000; border-bottom:1px solid var(--line);">
              <img src="{{ post.img }}" alt="{{ post.title }}" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;"/>
            </div>
            <div style="padding:clamp(18px,2vw,24px); display:flex; flex-direction:column; gap:10px;">
              <span style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--dim);">{{ post.date }}</span>
              <h3 style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:20px; letter-spacing:-0.01em; margin:0; line-height:1.25;">{{ post.title }}</h3>
              <p style="font-size:14px; line-height:1.55; color:var(--dim); margin:0;">{{ post.excerpt }}</p>
            </div>
          </a>
        </sc-for>
      </div>
    </section>
  </main>

  <footer style="background:var(--fg); color:var(--bg);">
    <div style="max-width:1200px; margin:0 auto; padding:clamp(32px,4vw,56px) clamp(16px,4vw,40px); display:flex; flex-wrap:wrap; gap:16px 24px; align-items:center; justify-content:space-between;">
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(30px,5vw,54px); letter-spacing:0.06em; line-height:1;">BLUWX</div>
      <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.06em; opacity:0.75;">Blog · the padel community</div>
    </div>
  </footer>

</div>
</helmet>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      cartCount: window.CartStore ? window.CartStore.count() : 0,
      posts: [
        { title: "Comunidad de Madrid Premier Padel P1 by Oysho — Movistar Arena, September 2026", date: "August 9, 2026", excerpt: "Madrid's 5th consecutive Premier Padel P1 edition heads to the Movistar Arena this September, backed by the FIP.", img: "uploads/poster-blog-spain.webp", href: "Blog Post - Madrid Premier Padel P1.dc.html" },
        { title: "FIP Promises Bali 2026 Comes to Indonesia", date: "August 9, 2026", excerpt: "BLUWX player Zara Settimi joins the FIP Promises Bali 2026 field, facing Bellaluna in Indonesia.", img: "uploads/pasted-1786286439439-0.png", href: "Blog Post - FIP Promises Bali.dc.html" },
      ],
    };
  }
}

</script>
</body>
</html>
